name: Deploy Microservices

on:
  workflow_run:
    workflows:
      - Validate
    types:
      - completed

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Get changed files
        id: changed-files
        run: |
          git diff --name-only HEAD^ HEAD > changed_files.txt
          echo "Changed files:"
          cat changed_files.txt

          SERVICES=""
          if grep -q "microservices/iam/" changed_files.txt; then
            SERVICES="$SERVICES iam"
          fi
          if grep -q "microservices/sales/" changed_files.txt; then
            SERVICES="$SERVICES sales"
          fi
          if grep -q "microservices/inventory/" changed_files.txt; then
            SERVICES="$SERVICES inventory"
          fi
          if grep -q "microservices/warehouse/" changed_files.txt; then
            SERVICES="$SERVICES warehouse"
          fi
          if grep -q "microservices/logistics/" changed_files.txt; then
            SERVICES="$SERVICES logistics"
          fi
          if grep -q "microservices/analytics/" changed_files.txt; then
            SERVICES="$SERVICES analytics"
          fi

          FRONTEND_CHANGED=0
          if grep -qE "frontend-1/|frontend/" changed_files.txt; then
            FRONTEND_CHANGED=1
          fi

          echo "Changed services: $SERVICES"
          echo "Frontend changed: $FRONTEND_CHANGED"
          echo "CHANGED_SERVICES=$SERVICES" >> $GITHUB_ENV
          echo "FRONTEND_CHANGED=$FRONTEND_CHANGED" >> $GITHUB_ENV

      - name: Set up SSH
        if: env.CHANGED_SERVICES != ''
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        if: env.CHANGED_SERVICES != ''
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} "eval \"\$(ssh-agent -s)\" && ssh-add ~/.ssh/git-key && cd ~/smart-chain && git pull"

          for service in ${{ env.CHANGED_SERVICES }}; do
            echo "Deploying $service microservice..."
            ssh ubuntu@${{ secrets.EC2_HOST }} "cd ~/smart-chain/microservices/$service && npm ci && pm2 restart $service"
          done

          ssh ubuntu@${{ secrets.EC2_HOST }} "pm2 status"

      - name: Frontend path note
        if: env.FRONTEND_CHANGED == '1'
        run: echo "frontend-1 or frontend changed; no EC2 deploy step is configured for the Vite app."
