name: Validate

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analytics:
    name: Analytics tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: microservices/analytics/package-lock.json

      - name: Install and test Analytics
        working-directory: microservices/analytics
        run: |
          npm ci
          npm test

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend-1/package-lock.json

      - name: Lint and build frontend-1
        working-directory: frontend-1
        run: |
          npm ci
          npm run lint
          npm run build

  experiments:
    name: Experiment report check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: experiments/requirements.txt

      - name: Install pins and check reports
        working-directory: experiments
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m unittest test_ingest_uci_retail.py test_rolling_forecast.py test_render_retail_forecast.py
          python generate_reports.py --check

  services:
    name: ${{ matrix.service }} package check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [iam, sales, inventory, warehouse, logistics]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: microservices/${{ matrix.service }}/package-lock.json

      - name: Install and syntax-check ${{ matrix.service }}
        working-directory: microservices/${{ matrix.service }}
        run: |
          npm ci
          node --check app.js
